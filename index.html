<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

<link rel="manifest" href="./manifest.json" />
<title>Treino</title>
<style>
  :root{
    --bg:#0F1013; --card:#1E2127; --card2:#14161A; --border:#2A2E36;
    --accent:#C8FF3D; --text:#F2F3F0; --muted:#8B8F98; --muted2:#6B7078;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; }
  .mono{ font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace; }
  #app{ max-width:480px; margin:0 auto; min-height:100vh; padding-bottom:88px; position:relative; }
  .topbar{ padding:24px 20px 12px; }
  .eyebrow{ font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted2); font-weight:600; }
  h1.title{ font-size:28px; font-weight:800; margin:2px 0 0; letter-spacing:-.01em; }
  .banner{ margin:0 20px 16px; background:rgba(200,255,61,.1); border:1px solid rgba(200,255,61,.25);
    border-radius:12px; padding:12px 14px; display:flex; gap:10px; align-items:center; font-size:12.5px; color:#d5d7db; }
  .card{ background:var(--card); border:1px solid var(--border); border-radius:16px; }
  .section{ padding:0 20px; margin-top:24px; }
  .streak-card{ margin:0 20px; padding:18px; }
  .streak-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .streak-label{ display:flex; align-items:center; gap:8px; font-weight:600; font-size:14px; }
  .streak-num{ color:var(--accent); font-size:24px; font-weight:800; }
  .week-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:8px; margin-bottom:14px; }
  .day-col{ display:flex; flex-direction:column; align-items:center; gap:6px; }
  .day-letter{ font-size:10px; color:var(--muted2); }
  .day-box{ width:100%; aspect-ratio:1; border-radius:8px; display:flex; align-items:center; justify-content:center;
    background:var(--card2); border:1px solid var(--border); color:transparent; }
  .day-box.done{ background:var(--accent); color:#0F1013; border:none; }
  .streak-foot{ display:flex; justify-content:space-between; padding-top:12px; border-top:1px solid var(--border); font-size:12px; }
  .streak-foot span:first-child{ color:var(--muted); }
  .workout-card{ width:100%; text-align:left; padding:18px; cursor:pointer; background:linear-gradient(135deg,var(--card),#181A1F);
    border:1px solid var(--border); border-radius:16px; color:inherit; }
  .workout-top{ display:flex; align-items:flex-start; justify-content:space-between; }
  .workout-name{ display:flex; align-items:center; gap:8px; margin-bottom:4px; }
  .badge-letter{ width:28px; height:28px; border-radius:50%; background:var(--accent); color:#0F1013; font-weight:800;
    display:flex; align-items:center; justify-content:center; font-size:14px; flex-shrink:0; }
  .badge-letter.ghost{ background:var(--card2); color:var(--muted2); border:1px solid var(--border); }
  .wname{ font-weight:600; }
  .wsub{ font-size:12px; color:var(--muted); margin-top:6px; }
  .pill-row{ display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; }
  .pill{ font-size:11px; font-weight:500; padding:5px 10px; border-radius:999px; background:var(--card2); color:var(--muted); border:1px solid var(--border); }
  .pill.accent{ background:rgba(200,255,61,.1); color:var(--accent); border-color:rgba(200,255,61,.3); }
  .selector-row{ display:flex; gap:8px; margin-top:12px; padding:0 20px; }
  .sel-btn{ flex:1; padding:10px; border-radius:10px; font-size:12px; font-weight:700; background:var(--card); color:var(--muted2);
    border:1px solid var(--border); cursor:pointer; }
  .sel-btn.active{ background:rgba(200,255,61,.1); color:var(--accent); border-color:rgba(200,255,61,.3); }
  .seq-note{ font-size:10.5px; color:var(--muted2); margin:8px 20px 0; }
  .week-list{ display:flex; flex-direction:column; gap:8px; }
  .week-item{ display:flex; align-items:center; gap:12px; padding:12px 14px; }
  .week-item span.wtext{ font-size:13px; color:#d5d7db; flex:1; }
  .topline{ display:flex; align-items:center; gap:12px; padding:20px 20px 8px; }
  .backbtn{ background:none; border:none; color:var(--muted); cursor:pointer; padding:4px; display:flex; }
  .progress-track{ height:6px; border-radius:99px; background:var(--card); overflow:hidden; margin:0 20px; }
  .progress-fill{ height:100%; background:var(--accent); transition:width .3s; }
  .progress-label{ font-size:11px; color:var(--muted2); margin:8px 20px 16px; }
  .ex-list{ display:flex; flex-direction:column; gap:10px; padding:0 20px; }
  .ex-card{ padding:14px; }
  .ex-card.done{ opacity:.55; }
  .ex-top{ display:flex; justify-content:space-between; gap:10px; align-items:flex-start; }
  .ex-name{ font-weight:600; font-size:15px; margin:2px 0 0; }
  .ex-name.strike{ text-decoration:line-through; color:var(--muted2); }
  .ex-meta{ font-size:12px; color:var(--muted); margin-top:4px; }
  .check-btn{ width:32px; height:32px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    background:var(--card2); border:1px solid var(--border); color:transparent; cursor:pointer; }
  .check-btn.done{ background:var(--accent); color:#0F1013; border:none; }
  .load-row{ display:flex; align-items:center; justify-content:space-between; margin-top:10px; background:var(--card2);
    border:1px solid var(--border); border-radius:10px; padding:8px 12px; }
  .load-row .lbl{ font-size:11px; color:var(--muted2); }
  .load-ctrl{ display:flex; align-items:center; gap:12px; }
  .step-btn{ width:24px; height:24px; border-radius:6px; background:var(--card); border:1px solid var(--border); color:var(--muted);
    display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:14px; line-height:1; }
  .load-val{ font-size:13px; font-weight:700; width:56px; text-align:center; }
  .video-btn{ display:flex; align-items:center; gap:6px; margin-top:10px; background:none; border:none; color:var(--muted);
    font-size:12px; cursor:pointer; padding:0; }
  .finish-bar{ position:sticky; bottom:0; padding:14px 20px 20px; margin-top:20px; }
  .finish-btn{ width:100%; padding:14px; border-radius:12px; background:var(--accent); color:#0F1013; font-weight:800;
    border:none; font-size:14px; cursor:pointer; }
  .finish-btn:disabled{ background:var(--card2); color:var(--muted2); }
  .modal-bg{ position:fixed; inset:0; background:rgba(0,0,0,.8); display:flex; align-items:flex-end; z-index:50; }
  .modal-sheet{ width:100%; max-width:480px; margin:0 auto; background:var(--card2); border-top:1px solid var(--border);
    border-radius:20px 20px 0 0; padding:16px; }
  .modal-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .modal-head p{ font-size:13px; font-weight:700; margin:0; }
  .modal-close{ background:none; border:none; color:var(--muted); cursor:pointer; }
  .video-wrap{ border-radius:12px; overflow:hidden; background:#000; aspect-ratio:16/9; }
  .video-wrap iframe{ width:100%; height:100%; border:none; }
  .settings-list{ display:flex; flex-direction:column; gap:8px; }
  .settings-item{ display:flex; justify-content:space-between; align-items:center; padding:14px; }
  .settings-item .k{ font-size:13px; color:var(--muted); }
  .settings-item .v{ font-size:13px; font-weight:600; }
  .navbar{ position:fixed; bottom:0; left:0; right:0; background:rgba(20,22,26,.96); backdrop-filter:blur(8px);
    border-top:1px solid var(--border); padding:10px 24px 14px; display:flex; justify-content:space-around; max-width:480px; margin:0 auto; }
  .nav-btn{ display:flex; flex-direction:column; align-items:center; gap:4px; background:none; border:none; color:var(--muted2);
    cursor:pointer; flex:1; font-family:inherit; }
  .nav-btn.active{ color:var(--accent); }
  .nav-btn span{ font-size:10px; font-weight:600; }
  .loading{ display:flex; align-items:center; justify-content:center; height:100vh; color:var(--muted); font-size:13px; }
  .login-wrap{ min-height:100vh; display:flex; flex-direction:column; justify-content:center; padding:24px; }
  .login-input{ width:100%; padding:14px; border-radius:12px; background:var(--card); border:1px solid var(--border);
    color:var(--text); font-size:14px; margin:16px 0; font-family:inherit; }
  .login-input:focus{ outline:none; border-color:var(--accent); }
  .login-btn{ width:100%; padding:14px; border-radius:12px; background:var(--accent); color:#0F1013; font-weight:800;
    border:none; font-size:14px; cursor:pointer; }
  .login-btn:disabled{ background:var(--card2); color:var(--muted2); }
  .login-msg{ font-size:12px; color:var(--muted); text-align:center; margin-top:14px; line-height:1.5; }
  .login-msg.err{ color:#ff8080; }
  .logout-btn{ width:100%; margin-top:12px; padding:12px; border-radius:10px; background:none; border:1px solid var(--border);
    color:var(--muted); font-size:12px; cursor:pointer; }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<body>

<script>
// ---------------- DADOS ----------------
const SEQUENCIA = ["A","B","C"];

const TREINOS = {
  A: { letra:"A", nome:"Peito, Ombro e Tríceps", nivel:"Intermediário", duracao:"48 min", exercicios:[
    {id:"A1", nome:"Supino reto barra", series:4, reps:"8-10", grupo:"Peito", cargaBase:60, videoId:"rT7DgCr-3pg"},

    {id:"A3", nome:"Crucifixo máquina", series:3, reps:"12-15", grupo:"Peito", cargaBase:32, videoId:"eozdVDA78K0"},
    {id:"A4", nome:"Desenvolvimento halter", series:4, reps:"8-10", grupo:"Ombro", cargaBase:16, videoId:"qEwKCR5JCog"},
    {id:"A5", nome:"Elevação lateral", series:3, reps:"12-15", grupo:"Ombro", cargaBase:10, videoId:"3VcKaXpzqRo"},
    {id:"A6", nome:"Tríceps corda", series:3, reps:"12-15", grupo:"Tríceps", cargaBase:25, videoId:"vB5OHsJ3EME"},
    {id:"A7", nome:"Tríceps francês", series:3, reps:"10-12", grupo:"Tríceps", cargaBase:18, videoId:"_gsUck-7M74"},
  ]},
  B: { letra:"B", nome:"Costas e Bíceps", nivel:"Intermediário", duracao:"45 min", exercicios:[
    {id:"B1", nome:"Puxada frente", series:4, reps:"8-10", grupo:"Costas", cargaBase:55, videoId:"CAwf7n6Luuc"},
    {id:"B2", nome:"Remada curvada barra", series:4, reps:"8-10", grupo:"Costas", cargaBase:40, videoId:"9efgcAjQe7E"},
    {id:"B3", nome:"Remada baixa cabo", series:3, reps:"10-12", grupo:"Costas", cargaBase:45, videoId:"GZbfZ033f74"},
    {id:"B4", nome:"Rosca direta barra", series:3, reps:"10-12", grupo:"Bíceps", cargaBase:22, videoId:"kwG2ipFRgfo"},
    {id:"B5", nome:"Rosca alternada halter", series:3, reps:"10-12", grupo:"Bíceps", cargaBase:10, videoId:"sAq_ocpRh_I"},
  ]},
  C: { letra:"C", nome:"Pernas completo", nivel:"Intermediário", duracao:"52 min", exercicios:[
    {id:"C1", nome:"Agachamento livre", series:4, reps:"8-10", grupo:"Pernas", cargaBase:70, videoId:"Dy28eq2PjcM"},
    {id:"C2", nome:"Leg press 45°", series:4, reps:"10-12", grupo:"Pernas", cargaBase:140, videoId:"IZxyjW7MPJQ"},
    {id:"C3", nome:"Cadeira extensora", series:3, reps:"12-15", grupo:"Pernas", cargaBase:35, videoId:"YyvSfVjQeL0"},
    {id:"C4", nome:"Mesa flexora", series:3, reps:"12-15", grupo:"Pernas", cargaBase:30, videoId:"1Tq3QdYUuHs"},
    {id:"C5", nome:"Panturrilha em pé", series:4, reps:"15-20", grupo:"Panturrilha", cargaBase:50, videoId:"gwLzBJYoWlI"},
  ]},
};

const DIAS_SEMANA_LABEL = ["S","T","Q","Q","S","S","D"]; // seg..dom

// ---------------- CONFIGURAÇÃO SUPABASE ----------------
// Preencha com os dados do SEU projeto (Supabase → Settings → API)
const SUPABASE_URL = "https://shubsjnabklvskjjdgox.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNodWJzam5hYmtsdnNrampkZ294Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUxODQzNTMsImV4cCI6MjEwMDc2MDM1M30.BG92H2d57mpIhnMzeW5AzpBjR-flVvT_uH-1MsakUBs";
const sb = (SUPABASE_URL.startsWith("http"))
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
  : null;

// ---------------- ESTADO ----------------
let S = { checkins:[], cargas:{}, concluidosHoje:null, perfil:null };
let session = null;
let tela = "home";
let videoAberto = null;
let loginStatus = null; // {tipo:'ok'|'erro', msg}

function hojeISO(){ return new Date().toISOString().slice(0,10); }

async function init(){
  if(!sb){ renderConfigFaltando(); return; }
  const { data } = await sb.auth.getSession();
  session = data.session;
  sb.auth.onAuthStateChange((_event, s) => { session = s; carregarTudo(); });
  await carregarTudo();
}

async function carregarTudo(){
  if(!session){ render(); return; }
  const uid = session.user.id;

  const [{data: perfilRow}, {data: checkinsRows}, {data: cargasRows}, {data: hojeRow}] = await Promise.all([
    sb.from("perfis").select("*").eq("id", uid).maybeSingle(),
    sb.from("checkins").select("data, letra").eq("user_id", uid).order("data"),
    sb.from("cargas").select("exercicio_id, valor").eq("user_id", uid),
    sb.from("concluidos_hoje").select("*").eq("user_id", uid).maybeSingle(),
  ]);

  S.perfil = perfilRow || null;
  S.checkins = checkinsRows || [];
  S.cargas = {};
  (cargasRows || []).forEach(r => { S.cargas[r.exercicio_id] = Number(r.valor); });
  S.concluidosHoje = (hojeRow && hojeRow.data === hojeISO()) ? { data: hojeRow.data, letra: hojeRow.letra, ids: hojeRow.ids || [] } : null;

  render();
}

async function entrarComSenha(email, senha){
  loginStatus = null; render();
  const { error } = await sb.auth.signInWithPassword({ email, password: senha });
  if(error){
    loginStatus = { tipo:"erro", msg: "E-mail ou senha incorretos, ou a conta ainda não existe. Se for sua primeira vez, use \"Criar conta\"." };
    render();
  }
  // se der certo, onAuthStateChange cuida de recarregar tudo
}

async function criarConta(email, senha){
  loginStatus = null; render();
  const { data, error } = await sb.auth.signUp({ email, password: senha });
  if(error){
    loginStatus = { tipo:"erro", msg: error.message.includes("already registered") || error.message.includes("already been registered")
      ? "Esse e-mail já tem conta. Use \"Entrar\" com sua senha."
      : "Não foi possível criar a conta: " + error.message };
    render();
    return;
  }
  if(data.session){
    // confirmação de e-mail desativada no Supabase -> já entra direto
    return;
  }
  loginStatus = { tipo:"ok", msg: "Conta criada! Se a confirmação por e-mail estiver ativa no Supabase, confira sua caixa de entrada. Se não, tente \"Entrar\" agora." };
  render();
}

async function sair(){
  await sb.auth.signOut();
  S = { checkins:[], cargas:{}, concluidosHoje:null, perfil:null };
  tela = "home";
  render();
}

// ---------------- ONBOARDING ----------------
async function salvarPerfil(sexo){
  S.perfil = { id: session.user.id, sexo, nivel: null, objetivo: null, dias_semana: null };
  render();
}

function renderOnboarding(){
  return `
    <div class="topbar">
      <p class="eyebrow mono">Antes de começar</p>
      <h1 class="title">Configure seu treino</h1>
    </div>
    <div class="section" style="margin-top:16px;">
      <p class="eyebrow mono" style="margin-bottom:10px;">Sexo do plano</p>
      <div class="selector-row" style="padding:0;margin:0 0 24px;">
        <button class="sel-btn" onclick="salvarPerfil('Masculino')">Masculino</button>
        <button class="sel-btn" onclick="salvarPerfil('Feminino')">Feminino</button>
      </div>
    </div>
  `;
}

function renderOnboardingNivel(){
  return `
    <div class="topbar">
      <p class="eyebrow mono">Passo 2 de 2</p>
      <h1 class="title">Qual seu nível hoje?</h1>
    </div>
    <div class="section" style="margin-top:8px;display:flex;flex-direction:column;gap:10px;">
      ${[
        ["Iniciante","nunca treinei ou parei há muito tempo"],
        ["Intermediário","treino com regularidade há alguns meses"],
        ["Avançado","treino consistente há mais de 1 ano"],
      ].map(([lvl,desc])=>`
        <button class="card workout-card" style="padding:14px;" onclick="finalizarOnboarding('${lvl}')">
          <p class="wname" style="margin:0;">${lvl}</p>
          <p class="wsub" style="margin-top:4px;">${desc}</p>
        </button>
      `).join("")}
    </div>
  `;
}

async function finalizarOnboarding(nivel){
  S.perfil.nivel = nivel;
  S.perfil.objetivo = "Hipertrofia + definição";
  S.perfil.dias_semana = 5;
  render(); // otimista — mostra a tela na hora
  const { error } = await sb.from("perfis").upsert(S.perfil);
  if(error) console.error(error);
}

// ---------------- LÓGICA DE SEQUÊNCIA ----------------
function proximoDaSequencia(letra){
  const idx = SEQUENCIA.indexOf(letra);
  return SEQUENCIA[(idx+1) % SEQUENCIA.length];
}
function ultimoCheckinLetra(){
  if(S.checkins.length===0) return "C"; // default: próximo automático começa em A
  return S.checkins[S.checkins.length-1].letra;
}
function letraAtiva(){
  if(S.concluidosHoje && S.concluidosHoje.data === hojeISO()) return S.concluidosHoje.letra;
  return proximoDaSequencia(ultimoCheckinLetra());
}
function isAutomatica(){
  if(!S.concluidosHoje || S.concluidosHoje.data !== hojeISO()) return true;
  return S.concluidosHoje.letra === proximoDaSequencia(ultimoCheckinLetra());
}
function cargaAtual(exId, base){
  return S.cargas[exId] !== undefined ? S.cargas[exId] : base;
}
function idsConcluidosHoje(){
  if(S.concluidosHoje && S.concluidosHoje.data === hojeISO()) return S.concluidosHoje.ids || [];
  return [];
}
function pulosSeguidos(letra){
  // conta quantas vezes seguidas, a partir do checkin mais recente, essa letra foi "pulada"
  // (ou seja, outras letras foram escolhidas quando essa seria a natural)
  let count = 0;
  let ponteiro = ultimoCheckinLetra();
  for(let i=S.checkins.length-1; i>=0; i--){
    const esperado = proximoDaSequencia(i>0 ? S.checkins[i-1].letra : "C");
    if(esperado === letra){
      if(S.checkins[i].letra !== letra){ count++; } else { break; }
    }
  }
  return count;
}

// ---------------- AÇÕES ----------------
async function escolherTreino(letra){
  S.concluidosHoje = { data: hojeISO(), letra, ids: [] };
  render();
  await sb.from("concluidos_hoje").upsert({ user_id: session.user.id, data: S.concluidosHoje.data, letra, ids: [] });
}
async function toggleExercicio(exId){
  if(!S.concluidosHoje || S.concluidosHoje.data !== hojeISO()){
    S.concluidosHoje = { data: hojeISO(), letra: letraAtiva(), ids: [] };
  }
  const ids = S.concluidosHoje.ids || [];
  S.concluidosHoje.ids = ids.includes(exId) ? ids.filter(i=>i!==exId) : [...ids, exId];
  render();
  await sb.from("concluidos_hoje").upsert({
    user_id: session.user.id, data: S.concluidosHoje.data, letra: S.concluidosHoje.letra, ids: S.concluidosHoje.ids,
  });
}
async function ajustarCarga(exId, base, delta){
  const atual = cargaAtual(exId, base);
  const novaCarga = Math.max(0, +(atual + delta).toFixed(1));
  S.cargas[exId] = novaCarga;
  render();
  await sb.from("cargas").upsert({ user_id: session.user.id, exercicio_id: exId, valor: novaCarga });
}
async function finalizarTreino(){
  const letra = letraAtiva();
  const hoje = hojeISO();
  if(!S.checkins.find(c=>c.data===hoje)){
    S.checkins.push({ data: hoje, letra });
    render();
    await sb.from("checkins").insert({ user_id: session.user.id, data: hoje, letra });
  }
}
function abrirVideo(videoId, nome){ videoAberto = {videoId, nome}; render(); }
function fecharVideo(){ videoAberto = null; render(); }
function irPara(t){ tela = t; window.scrollTo(0,0); render(); }

// ---------------- ÍCONES (SVG inline) ----------------

// ---------------- RENDER ----------------
function render(){
  const app = document.getElementById("app");
  let html = "";
  if(!session){ html = renderLogin(); app.innerHTML = html; return; }
  if(!S.perfil){ html = renderOnboarding(); app.innerHTML = html; return; }
  if(!S.perfil.nivel){ html = renderOnboardingNivel(); app.innerHTML = html; return; }
  if(tela==="home") html = renderHome();
  else if(tela==="treino") html = renderTreino();
  else if(tela==="perfil") html = renderPerfil();
  html += renderNav();
  if(videoAberto) html += renderVideoModal();
  app.innerHTML = html;
}

function renderLogin(){
  return `
    <div class="login-wrap">
      <p class="eyebrow mono">Bem-vindo</p>
      <h1 class="title" style="margin-bottom:6px;">Entrar no Treino</h1>
      <p style="font-size:13px;color:var(--muted);">Digite seu e-mail e uma senha (mínimo 6 caracteres).</p>

      <input id="senhaInput" class="login-input" type="password" placeholder="senha" autocomplete="current-password" style="margin-top:-6px;" />
      <button class="login-btn" onclick="handleEntrar()">Entrar</button>
      <button class="logout-btn mono" style="margin-top:10px;" onclick="handleCriarConta()">Criar conta nova</button>

    </div>
  `;
}
function handleEntrar(){
  const email = document.getElementById("emailInput").value.trim();
  const senha = document.getElementById("senhaInput").value;
  if(!email || !senha){ loginStatus = {tipo:"erro", msg:"Preencha e-mail e senha."}; render(); return; }
  entrarComSenha(email, senha);
}
function handleCriarConta(){
  const email = document.getElementById("emailInput").value.trim();
  const senha = document.getElementById("senhaInput").value;
  if(!email || senha.length < 6){ loginStatus = {tipo:"erro", msg:"Preencha e-mail e uma senha com pelo menos 6 caracteres."}; render(); return; }
  criarConta(email, senha);
}

function calcularStreak(){
  const set = new Set(S.checkins.map(c=>c.data));
  let streak = 0;
  let d = new Date();
  // se hoje não treinou ainda, começa a contagem de ontem pra trás
  if(!set.has(hojeISO())) d.setDate(d.getDate()-1);
  while(true){
    const iso = d.toISOString().slice(0,10);
    if(set.has(iso)){ streak++; d.setDate(d.getDate()-1); } else break;
  }
  return streak;
}
function checkinsDoMes(){
  const now = new Date();
  return S.checkins.filter(c=>{
    const d = new Date(c.data+"T00:00:00");
    return d.getMonth()===now.getMonth() && d.getFullYear()===now.getFullYear();
  }).length;
}
function diasSemanaComTreino(){
  // segunda a domingo da semana atual
  const now = new Date();
  const diaSemana = (now.getDay()+6)%7; // 0=segunda
  const seg = new Date(now); seg.setDate(now.getDate()-diaSemana);
  const set = new Set(S.checkins.map(c=>c.data));
  const arr = [];
  for(let i=0;i<7;i++){
    const d = new Date(seg); d.setDate(seg.getDate()+i);
    arr.push(set.has(d.toISOString().slice(0,10)));
  }
  return arr;
}

        <span class="mono" style="font-size:10px;color:var(--muted2);">${auto?'sequência automática':'escolhido manualmente'}</span>
      </div>
      <button class="workout-card" onclick="irPara('treino')">
        <div class="workout-top">
          <div>
            <div class="workout-name">
              <span class="badge-letter">${t.letra}</span>

    <div class="section">

function renderTreino(){

    </div>

    <div class="progress-track">
      <div class="progress-fill" style="width:${(idsFeitos.length/t.exercicios.length)*100}%"></div>
    </div>
    <p class="progress-label mono">${idsFeitos.length} de ${t.exercicios.length} exercícios concluídos</p>

    <div class="ex-list">
      ${t.exercicios.map(ex=>{
        const feito = idsFeitos.includes(ex.id);
        const carga = cargaAtual(ex.id, ex.cargaBase);
        return `
        <div class="card ex-card ${feito?'done':''}">
          <div class="ex-top">
            <div style="flex:1;">
              <span class="pill">${ex.grupo}</span>
              <p class="ex-name ${feito?'strike':''}">${ex.nome}</p>
              <p class="ex-meta mono">${ex.series} séries × ${ex.reps} reps</p>
            </div>
            <button class="check-btn ${feito?'done':''}" onclick="toggleExercicio('${ex.id}')">${feito?ic.check:''}</button>
          </div>
          <div class="load-row">
            <span class="lbl mono">Carga atual</span>
            <div class="load-ctrl">
              <button class="step-btn" onclick="ajustarCarga('${ex.id}',${ex.cargaBase},-2.5)">−</button>
              <span class="load-val mono">${carga} kg</span>
              <button class="step-btn" onclick="ajustarCarga('${ex.id}',${ex.cargaBase},2.5)">+</button>
